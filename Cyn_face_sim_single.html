<body>

<h1>Drone 表情精修面板</h1>
<div class="sub">icon_editor 手绘精修 · 640×400 单色琥珀 EL 屏预览</div>

<div class="controls" id="moodBtns"></div>

  <button id="moodExport">⇧导出表情</button>
  <input type="file" id="moodFile" accept=".json,application/json" style="display:none">
</div>
<div class="controls" id="iconBtns"></div>
<div class="controls">
  <button id="iconImport">＋导入图标</button>

  <input type="file" id="iconFile" accept=".json,application/json" style="display:none">
</div>
<div class="controls">

  </span>

<script>
"use strict";
window.onerror = function (msg, src, line) {
  var e = document.getElementById('err');
  if (e) e.textContent = 'JS 错误: ' + msg + ' @行' + line;
  return false;
};

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 640, H = 400;

function fillEllipse(cx, cy, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(rx / 100, ry / 100);
  ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function strokeEllipse(cx, cy, rx, ry, color, lw) {
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(rx / 100, ry / 100);
  ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
// 波浪折线（颤抖线）：中心 x,y，总宽 w，振幅 amp，4 段
function waveLine(x, y, w, amp, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - w / 2, y);
  for (var i = 1; i <= 4; i++) {
    ctx.lineTo(x - w / 2 + w * i / 4, y + amp * (i % 2 === 1 ? 1 : -1));
  }
  ctx.stroke();
}
// 眼带：眼睛外侧同心弧（可配置：数量/半径/跨度/线宽/中心角/垂直偏移/正圆或椭圆）
// 默认 = scared 三条递减（正圆弧）；scary = 单条椭圆弧（与眼睛等比同心，端点切线自然向上）
function drawEyeBands(cx, cy, rx, ry, P, cfg) {
  if (!cfg) return;
  ctx.strokeStyle = P.line; ctx.lineWidth = cfg.lw || 5; ctx.lineCap = 'round';
  var oy = cy + (cfg.dy || 0);              // 垂直偏移：弧圆心整体下移
  var baseAng = (cx < 320)
    ? (cfg.baseL !== undefined ? cfg.baseL : Math.PI * 7 / 9)   // 左眼默认~140°
    : (cfg.baseR !== undefined ? cfg.baseR : Math.PI * 2 / 9);  // 右眼默认~40°
  var rads = cfg.rads || [1.5, 1.8, 2.1];   // 半径倍数
  var spans = cfg.spans || [0.35, 0.26, 0.18];  // 半角跨度（弧度）
  for (var k = 0; k < rads.length; k++) {
    ctx.beginPath();
    if (cfg.ellipse) {   // 等比椭圆弧：rx/ry 同倍放大，与眼睛椭圆完全同心
      ctx.ellipse(cx, oy, rx * rads[k], ry * rads[k], 0, baseAng - spans[k], baseAng + spans[k]);
    } else {             // 正圆弧（scared 定型样式）
      ctx.arc(cx, oy, rx * rads[k], baseAng - spans[k], baseAng + spans[k]);
    }
    ctx.stroke();
  }
}

function renderEye(eye, P) {
  var t = eye.type, lw = 4;
  if (t === 'ellipse') {
    if (eye.cap) {   // 盖子眼：实心椭圆 + 上半覆盖（横切/斜切）+ 切口线（眨眼不作用）
      fillEllipse(eye.cx, eye.cy, eye.rx, eye.ry, P.line);
      var cy2 = eye.cap.y, cw2 = eye.cap.w || eye.rx, clw = eye.cap.lw || 10;
      var tilt = eye.cap.tilt || 0, dir = eye.cap.dir || 0;   // dir: 0=横线 1=撇(右上→左下) -1=捺(左上→右下)
      ctx.fillStyle = '#000';
      if (dir === 0) {   // 横切（unamused）：覆盖上半 + 横线或梯形盖子
        ctx.fillRect(eye.cx - eye.rx - 6, eye.cy - eye.ry - 6, (eye.rx + 6) * 2, cy2 - eye.cy + eye.ry + 8);
        if (eye.cap.trap) {   // 梯形盖子（备用）：上窄下宽
          var tp = eye.cap.trap;
          ctx.fillStyle = P.line;
          ctx.beginPath();
          ctx.moveTo(eye.cx - tp.top, cy2 - tp.h);
          ctx.lineTo(eye.cx + tp.top, cy2 - tp.h);
          ctx.lineTo(eye.cx + tp.bot, cy2 + tp.h);
          ctx.lineTo(eye.cx - tp.bot, cy2 + tp.h);
          ctx.closePath();
          ctx.fill();
        } else if (eye.cap.lid) {   // 蝌蚪形盖子（sad）：细尖 + 粗线 + 大圆头相切，圆在 dir 指向侧
          var ld = eye.cap.lid;
          var d = ld.dir || 1;               // 1=尖在左圆在右，-1=镜像（尖在右圆在左）
          var w = ld.w || 80;                // 半长（尖到圆心的距离）
          var r = ld.r || 16;                // 圆头半径（大圆）
          var tipX = eye.cx - d * w, rndX = eye.cx + d * w;
          var yB = cy2;                      // 下边（切口位置，平直）
          var rndY = yB - r;                 // 圆头圆心
          ctx.fillStyle = P.line;
          ctx.beginPath();
          ctx.moveTo(tipX, yB);                        // 细尖
          ctx.lineTo(rndX, yB);                        // 下边平直（到圆头底）
          ctx.arc(rndX, rndY, r, Math.PI / 2, Math.PI * 3 / 2);  // 大圆头（左半圆，与线相切）
          ctx.lineTo(tipX, yB);                        // 上边直线回尖端
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.strokeStyle = P.line; ctx.lineWidth = clw; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(eye.cx - cw2, cy2);
          ctx.lineTo(eye.cx + cw2, cy2);
          ctx.stroke();
        }
      } else {         // 斜切（保留备用）：clip 盖掉切口线上方 + 斜线
        var ax = eye.cx + dir * cw2, ay = cy2 - tilt;   // 切口上端
        var bx = eye.cx - dir * cw2, by = cy2 + tilt;   // 切口下端
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx - dir * 400, by + 400);
        ctx.lineTo(ax + dir * 400, ay - 400);
        ctx.closePath();
        ctx.clip();
        ctx.fillRect(eye.cx - 500, eye.cy - 500, 1000, 1000);
        ctx.restore();
        ctx.strokeStyle = P.line; ctx.lineWidth = clw; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    } else if (eye.hollow) {                                    // 空心粗描边：向内加粗；眨眼时上下压缩成宽线
      var hlw = eye.lw || 10;
      var eoH = Math.max(0.05, curEyeOpen);
      var ryEff = Math.max(eye.ry * eoH, hlw / 2 + 2);
      strokeEllipse(eye.cx, eye.cy, eye.rx - hlw / 2, ryEff - hlw / 2, P.line, hlw);
    } else {
      var eoF = Math.max(0.05, curEyeOpen);
      fillEllipse(eye.cx, eye.cy, eye.rx, eye.ry * eoF, P.line);   // 实心眼：眨眼上下压缩成宽线
    }
  } else if (t === 'arc_top' || t === 'arc_bottom') {
    ctx.strokeStyle = P.line; ctx.lineWidth = lw + 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(eye.x1, eye.y1);
    ctx.quadraticCurveTo(eye.cx, eye.cy, eye.x2, eye.y2); ctx.stroke();
  } else if (t === 'line') {
    ctx.strokeStyle = P.line; ctx.lineWidth = lw + 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(eye.x1, eye.y1); ctx.lineTo(eye.x2, eye.y2); ctx.stroke();
  } else if (t === 'x') {
    ctx.strokeStyle = P.line; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(eye.cx - eye.r, eye.cy - eye.r); ctx.lineTo(eye.cx + eye.r, eye.cy + eye.r);
    ctx.moveTo(eye.cx + eye.r, eye.cy - eye.r); ctx.lineTo(eye.cx - eye.r, eye.cy + eye.r);
    ctx.stroke();
  } else if (t === 'circle') {
    strokeEllipse(eye.cx, eye.cy, eye.r, eye.r, P.line, lw);
  } else if (t === 'cloud') {
    fillEllipse(eye.cx, eye.cy, eye.rx, eye.ry * 0.75, P.pupil);
    fillEllipse(eye.cx - eye.rx * 0.6, eye.cy - eye.ry * 0.1, eye.rx * 0.55, eye.ry * 0.5, P.pupil);
    fillEllipse(eye.cx + eye.rx * 0.6, eye.cy - eye.ry * 0.1, eye.rx * 0.55, eye.ry * 0.5, P.pupil);
    strokeEllipse(eye.cx, eye.cy, eye.rx, eye.ry * 0.75, P.line, 3);
  } else if (t === 'custom' && eye.points) {
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.moveTo(eye.points[0][0], eye.points[0][1]);
    for (var i = 1; i < eye.points.length; i++) ctx.lineTo(eye.points[i][0], eye.points[i][1]);
    ctx.closePath();
    if (eye.filled) ctx.fill(); else ctx.stroke();   // filled=实心封闭轮廓，否则描边
  }
}

function renderCoordMouth(m, P) {
  if (!m) return;
  ctx.strokeStyle = P.line; ctx.lineWidth = 5; ctx.lineCap = 'round';
  if (m.type === 'curve') {
    ctx.beginPath(); ctx.moveTo(m.x1, m.y1);
    ctx.quadraticCurveTo(m.cx, m.cy, m.x2, m.y2); ctx.stroke();
  } else if (m.type === 'line') {
    ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
  } else if (m.type === 'open') {
    fillEllipse(m.cx, m.cy, m.rx, m.ry, P.line);
    fillEllipse(m.cx, m.cy + m.ry * 0.15, m.rx * 0.6, m.ry * 0.55, '#000');
  }
}

// 点阵文本渲染（icon_editor 同款 8×12 字形，size 整数倍缩放）
function drawDotText(el, color) {
  var s = el.size || 1, sp = (el.spacing != null ? el.spacing : 1) * s;
  ctx.fillStyle = color;
  /* 非 hud 字体（如 ModernDOS）：canvas 矢量渲染（与 icon_editor 一致，无机杀手面部提示UI） */
  if (el.font && el.font !== 'hud') {
    ctx.font = (12 * s) + 'px ' + el.font;
    ctx.textBaseline = 'top';
    ctx.fillText(el.text, el.x, el.y);
    return;
  }
  var x = el.x;
  for (var ci = 0; ci < el.text.length; ci++) {
    var ch = el.text.charAt(ci).toUpperCase();
    var g = FONT8x12[ch] || FONT8x12[' '];
    for (var r = 0; r < 12; r++) for (var c2 = 0; c2 < 8; c2++) {
      if (g[r][c2] === '#') ctx.fillRect(x + c2 * s, el.y + r * s, s, s);
    }
    x += 8 * s + sp;
  }
}
function elCx(el){ if(el.type==='ellipse'||el.type==='circle'||el.type==='arc') return el.cx; if(el.type==='rect') return el.x+el.w/2; if(el.type==='line') return (el.x1+el.x2)/2; return 0; }
function elCy(el){ if(el.type==='ellipse'||el.type==='circle'||el.type==='arc') return el.cy; if(el.type==='rect') return el.y+el.h/2; if(el.type==='line') return (el.y1+el.y2)/2; return 0; }
// 扩展元素渲染（icon_editor 导出格式：ellipse/rect/circle/line/arc/polygon + erase 挖空 + rot 旋转）
function renderExtraElements(list, P) {
  if (!list) return;
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    ctx.save();
    if (el.blink) {   // 眨眼联动：以眼睛中心为锚整体收缩（下眼睑/笑纹随眨眼收起）
      var eo = Math.max(0.08, curEyeOpen);
      var anchor = el.blinkY || 200;
      ctx.translate(0, -(elCy(el) - anchor) * (1 - eo));
      el = JSON.parse(JSON.stringify(el));
      if (el.type === 'ellipse') el.ry *= eo;
      else if (el.type === 'circle') el.r *= eo;
      else if (el.type === 'rect') { var oh = el.h; el.h = oh * eo; el.y += (oh - el.h) / 2; }
    }
    if (el.rot) { var cx0 = elCx(el), cy0 = elCy(el); ctx.translate(cx0, cy0); ctx.rotate(el.rot * Math.PI / 180); ctx.translate(-cx0, -cy0); }
    var col = el.erase ? '#000' : P.line;      // erase = 用背景黑挖空
    ctx.fillStyle = col; ctx.strokeStyle = col;
    ctx.lineWidth = el.lw || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    var fill = el.fill !== false;
    if (el.type === 'ellipse') { ctx.beginPath(); ctx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
    else if (el.type === 'circle') { ctx.beginPath(); ctx.arc(el.cx, el.cy, el.r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
    else if (el.type === 'rect') { ctx.beginPath(); ctx.rect(el.x, el.y, el.w, el.h); if (fill) ctx.fill(); else ctx.stroke(); }
    else if (el.type === 'line') { ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke(); }
    else if (el.type === 'polyline' || el.type === 'polygon') {
      ctx.beginPath();
      for (var k = 0; k < el.points.length; k++) k ? ctx.lineTo(el.points[k][0], el.points[k][1]) : ctx.moveTo(el.points[k][0], el.points[k][1]);
      if (el.type === 'polygon') ctx.closePath();
      if (fill) ctx.fill(); else ctx.stroke();
    }
    else if (el.type === 'arc') {
      ctx.beginPath();
      if (el.rx > 0 && el.ry > 0) ctx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, el.a0, el.a1);
      else ctx.arc(el.cx, el.cy, el.r, el.a0, el.a1);
      if (fill) ctx.fill(); else ctx.stroke();
    }
    else if (el.type === 'text') {   // 点阵文本（EL HUD 8×12 字形，与 icon_editor/上屏一致）
      drawDotText(el, col);
    }
    ctx.restore();
  }
}

function drawCoord(cd, P) {
  var i;
  for (i = 0; i < cd.eyes.length; i++) renderEye(cd.eyes[i], P);
  if (cd.pupils) for (i = 0; i < cd.pupils.length; i++)
    if (cd.pupils[i]) fillEllipse(cd.pupils[i].cx, cd.pupils[i].cy, cd.pupils[i].r, cd.pupils[i].r, P.pupil);
  if (cd.highlights) for (i = 0; i < cd.highlights.length; i++)
    if (cd.highlights[i]) fillEllipse(cd.highlights[i].cx, cd.highlights[i].cy, cd.highlights[i].r, cd.highlights[i].r, P.high);
  if (cd.brows) for (i = 0; i < cd.brows.length; i++)
    if (cd.brows[i]) {
      ctx.strokeStyle = P.line; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cd.brows[i].x1, cd.brows[i].y1); ctx.lineTo(cd.brows[i].x2, cd.brows[i].y2); ctx.stroke();
    }
  renderCoordMouth(cd.mouth, P);
  if (cd.eyeBands) for (i = 0; i < cd.eyes.length; i++)
    drawEyeBands(cd.eyes[i].cx, cd.eyes[i].cy, cd.eyes[i].rx, cd.eyes[i].ry, P, cd.eyeBands);
  if (cd.extraMarks) for (i = 0; i < cd.extraMarks.length; i++) {
    var mk = cd.extraMarks[i];
    if (mk.type === 'wave') waveLine(mk.cx, mk.cy, mk.w, mk.amp, P.line);
  }
  if (cd.elements) renderExtraElements(cd.elements, P);   // icon_editor 元素格式（含 erase 挖空/旋转）
  if (cd.extra) {
    ctx.fillStyle = P.line; ctx.font = '16px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText(cd.extra, 320, 385);
  }
}

  a.download = 'custom_icons_' + Date.now().toString(36) + '.json'; a.click(); URL.revokeObjectURL(a.href);
}
function pickIconsFile(){ var inp = document.getElementById('iconFile'); if (!inp) return; inp.value=''; inp.click(); }

// ---- 自定义角标 ----
var CYN_BADGES_KEY = 'cynCustomBadges', CYN_BADGE_SEL_KEY = 'cynBadgeSel';
var CUSTOM_BADGES = loadCustomBadges(), badgeSel = loadBadgeSel();
function loadCustomBadges(){ try{ return JSON.parse(localStorage.getItem(CYN_BADGES_KEY) || '[]'); }catch(e){ return []; } }
function saveCustomBadges(){ try{ localStorage.setItem(CYN_BADGES_KEY, JSON.stringify(CUSTOM_BADGES)); }catch(e){} }
function loadBadgeSel(){ try{ return localStorage.getItem(CYN_BADGE_SEL_KEY) || 'badge_builtin'; }catch(e){ return 'badge_builtin'; } }
function saveBadgeSel(){ try{ localStorage.setItem(CYN_BADGE_SEL_KEY, badgeSel); }catch(e){} }
function getBadgeList(){ var l=[{n:'高温角标',key:'badge_builtin',elements:ICON_BADGE.elements}]; CUSTOM_BADGES.forEach(function(c,i){ l.push({n:c.n,key:'badge_'+i,elements:c.elements}); }); return l; }
function getBadgeCoord(key){ var b = getBadgeList().filter(function(x){return x.key===key;})[0]; return b ? {elements:b.elements} : {elements:ICON_BADGE.elements}; }
function delCustomBadge(key){
  var m = /^badge_(\d+)$/.exec(key); if (!m) return;
  var idx = +m[1], c = CUSTOM_BADGES[idx]; if (!c) return;
  if (!confirm('删除自定义角标「' + c.n + '」？')) return;
  CUSTOM_BADGES.splice(idx,1); saveCustomBadges();
  var len = CUSTOM_BADGES.length;
  badgeSel = len ? ('badge_' + Math.min(idx, len-1)) : 'badge_builtin';
  saveBadgeSel();
  renderBadgeSel();
}
function importBadgesFromText(txt){
  var o; try{ o = JSON.parse(txt); }catch(e){ alert('JSON 解析失败：' + e.message); return; }
  var add = [];
  var isArr = Object.prototype.toString.call(o) === '[object Array]';
  var isArr2 = function(x){ return Object.prototype.toString.call(x) === '[object Array]'; };
  var push = function(f,i){ if (f && isArr2(f.elements)) add.push({ n:(f.n||('自定义角标'+(i+1))), elements:f.elements }); };
  if (isArr && o.length) o.forEach(push);
  else if (o.badges && isArr2(o.badges)) o.badges.forEach(push);
  else if (isArr2(o.elements)) add.push({ n:(o.name||'自定义角标'), elements:o.elements });
  if (!add.length){ alert('未找到有效的角标元素（elements）数据'); return; }
  if (!confirm('导入 ' + add.length + ' 个角标？\n' + add.map(function(a){return a.n;}).join('、'))) return;
  CUSTOM_BADGES = CUSTOM_BADGES.concat(add); saveCustomBadges();
  renderBadgeSel();
  alert('已导入 ' + add.length + ' 个角标，可在「警告角标」下拉选择');
}
function exportBadges(){
  if (!CUSTOM_BADGES.length){ alert('当前没有自定义角标可导出'); return; }
  var data = { name:'自定义角标包', version:1, count:CUSTOM_BADGES.length, badges:CUSTOM_BADGES };
  var blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'custom_badges_' + Date.now().toString(36) + '.json'; a.click(); URL.revokeObjectURL(a.href);
}
function pickBadgesFile(){ var inp = document.getElementById('badgeFile'); if (!inp) return; inp.value=''; inp.click(); }
function renderBadgeSel(){
  var sel = document.getElementById('badgeSel');
  if (!sel) return;
  var keys = getBadgeList().map(function(b){return b.key;});
  if (keys.indexOf(badgeSel) < 0) { badgeSel = keys[0]; saveBadgeSel(); }
  sel.innerHTML = '';
  getBadgeList().forEach(function(b){ var o=document.createElement('option'); o.value=b.key; o.textContent=b.n; sel.appendChild(o); });
  sel.value = badgeSel;
  var del = document.getElementById('badgeDelete');
  if (del) del.disabled = !/^badge_\d+$/.test(badgeSel);
}

function renderIconBtns() {
  var box = document.getElementById('iconBtns');
  if (!box) return;
  box.innerHTML = '';
  var list = getIconList();
  for (var i = 0; i < list.length; i++) {
    (function (pg) {
      var b = document.createElement('button');
      b.textContent = pg.n;
      if (iconSel === pg.key) b.className = 'on';
      b.onclick = function () { iconSel = pg.key; renderIconBtns(); renderMoodBtns(); };
      box.appendChild(b);
      if (/^custom_icon_/.test(pg.key)) {   // 自定义图标：行尾加「✕」删除
        var x = document.createElement('button');
        x.textContent = '✕'; x.title = '删除该自定义图标';
        x.style.cssText = 'padding:0 6px;font-size:11px;border-color:#a33;color:#f88;margin-left:2px';
        x.onclick = function (e) { e.stopPropagation(); delCustomIcon(pg.key); };
        box.appendChild(x);
      }
    })(list[i]);
  }
  var fl = document.getElementById('iconFlashIn');
  if (fl) fl.value = iconSel ? getIconFlash(iconSel) : 0;
  renderBadgeSel();
}

function palette() {
  return { line: '#ffb347', pupil: '#a0762f', high: '#ffe9b8' };
}

function renderMoodBtns() {
  var box = document.getElementById('moodBtns');
  box.innerHTML = '';
  var list = getMoodList();
  for (var i = 0; i < list.length; i++) {
    (function (idx, exp) {
      var b = document.createElement('button');
      b.textContent = exp.n;
      if (idx === curExpr) b.className = 'on';
      b.onclick = function () {
        curExpr = idx;
        iconSel = null;          // 切到表情时清图标页
        renderMoodBtns();
        renderIconBtns();
      };
      box.appendChild(b);
      if (/^custom_/.test(exp.coord)) {   // 自定义表情：行尾加「✕」删除
        var x = document.createElement('button');
        x.textContent = '✕'; x.title = '删除该自定义表情';
        x.style.cssText = 'padding:0 6px;font-size:11px;border-color:#a33;color:#f88;margin-left:2px';
        x.onclick = function (e) { e.stopPropagation(); delCustomMood(exp.coord); };
        box.appendChild(x);
      }
    })(i, list[i]);
  }
}

// ---------- 绘制 ----------
var GLOBAL_SCALE = 0.9;   // 整体缩放系数（以画布中心为原点，调小=整体变小）

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  var P = palette();
  if (iconSel) {                              // 图标页：全屏 640×400，不缩放、不随鼠标追踪
    var pg0 = getIconList().filter(function (p) { return p.key === iconSel; })[0] || {};
    var flashHz = getIconFlash(iconSel);      // 每个图标可设闪烁频率；>0=闪烁（0.5Hz→周期2s）
    document.getElementById('st').textContent = '图标页: ' + pg0.n + ' | 警告/状态页';
    if (flashHz > 0) {
      var period = 1000 / flashHz;
      if ((performance.now() % period) >= (period / 2)) return;   // 灭相位：保持黑屏
    }
    var cd0 = getIconCoord(iconSel);
    renderExtraElements(cd0.elements, P);
    return;
  }
  var e = getMoodList()[curExpr];
  var cd = getMoodCoord(e.coord);
  ctx.save();
  ctx.translate(curOffX, curOffY);            // 鼠标追踪：整脸随鼠标方向平移
  ctx.translate(W / 2, H / 2);                // 整体缩放：以画布中心为原点
  ctx.scale(GLOBAL_SCALE, GLOBAL_SCALE);
  ctx.translate(-W / 2, -H / 2);
  drawCoord(cd, P);
  ctx.restore();

  drawIconBadge();   // 右上角警告小图标：不随表情追踪，10×10 位移防烧屏（画在 restore 后的原始坐标系）

  // 状态栏：表情名 + 眼睛几何摘要
  var eye0 = cd.eyes[0];
  var info = eye0 ? ((eye0.hollow ? '空心' : '实心') + ' ' + eye0.type + ' @(' + eye0.cx + ',' + eye0.cy + ') ' + eye0.rx + '×' + eye0.ry) : '符号表情(无椭眼)';
  document.getElementById('st').textContent =
    '表情: ' + e.n + ' | ' + info + ' | 已确认 ' + EXPRESSIONS.length + '/16 | 女仆';
}

// ---------- 眨眼（椭圆眼上下压缩成宽线再张开） ----------
var curEyeOpen = 1;          // 当前眼睛开合度：1=全开，0.05=闭合（宽线）
var blinkTimer = 4500, blinkPhase = 0;
var tPrev = performance.now();

// ---------- 鼠标追踪（整眼随鼠标方向平滑平移） ----------
var mouseTX = 0, mouseTY = 0, curOffX = 0, curOffY = 0;

function frame(now) {
  var dt = (now - tPrev) / 1000; tPrev = now;
  if (document.getElementById('autoBlink').checked) {
    blinkTimer -= dt * 1000;
    if (blinkTimer <= 0) { blinkPhase = 0.5; blinkTimer = 3000 + Math.random() * 12000; }   // 间隔 3~15s
  }
  if (blinkPhase > 0) {
    blinkPhase -= dt * 2.5;              // 一眨约 0.2s
    if (blinkPhase <= 0) blinkPhase = 0;
  }
  curEyeOpen = (blinkPhase > 0)
    ? Math.max(0.05, Math.cos(Math.min(1, blinkPhase * 4) * Math.PI))
    : 1;
  // 鼠标追踪：未勾选时目标归零；否则平滑跟随
  if (!document.getElementById('trackMouse').checked) { mouseTX = 0; mouseTY = 0; }
  curOffX += (mouseTX - curOffX) * Math.min(1, dt * 14);
  curOffY += (mouseTY - curOffY) * Math.min(1, dt * 14);
  // 右上角警告角标防烧屏：跳像素位移（与上位机一致）——每 3s 跳到 ±5 内 9 格之一，其余时间静止（减少帧变化）
  if (now - badgeLast > 3000) {
    badgeLast = now;
    badgeStep = (badgeStep + 1) % 9;
    badgeX = (badgeStep % 3 - 1) * 5;
    badgeY = (Math.floor(badgeStep / 3) - 1) * 5;
  }
  draw();
  requestAnimationFrame(frame);
}

// 鼠标追踪：整页监听（鼠标在页面任意位置都生效），坐标相对画布中心
window.addEventListener('mousemove', function (e) {
  var r = cv.getBoundingClientRect();
  var mx = (e.clientX - r.left) / r.width * W;
  var my = (e.clientY - r.top) / r.height * H;
  mouseTX = ((mx - 320) / 320) * 32;   // 水平最大 ±32px
  mouseTY = ((my - 200) / 200) * 24;   // 垂直最大 ±24px
});
window.addEventListener('blur', function () { mouseTX = 0; mouseTY = 0; });   // 离开窗口归位

renderMoodBtns();
renderIconBtns();
// ---- 自定义区绑定：表情/图标/角标导入导出 + 粘贴 + 闪烁 ----
document.getElementById('moodImport').onclick = pickMoodsFile;
document.getElementById('moodExport').onclick = exportMoods;
document.getElementById('iconImport').onclick = pickIconsFile;
document.getElementById('iconExport').onclick = exportIcons;
document.getElementById('badgeImport').onclick = pickBadgesFile;
document.getElementById('badgeExport').onclick = exportBadges;
var badgeSelEl = document.getElementById('badgeSel');
if (badgeSelEl) badgeSelEl.onchange = function(){ badgeSel = badgeSelEl.value; saveBadgeSel(); renderBadgeSel(); };
var badgeDelEl = document.getElementById('badgeDelete');
if (badgeDelEl) badgeDelEl.onclick = function(){ if (/^badge_\d+$/.test(badgeSel)) delCustomBadge(badgeSel); };
var iconFlashEl = document.getElementById('iconFlashIn');
if (iconFlashEl) iconFlashEl.onchange = function(){ if (iconSel) setIconFlash(iconSel, iconFlashEl.value); };
function bindFile(id, cb){ var el = document.getElementById(id); if (el) el.addEventListener('change', function(){ var f = el.files && el.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ cb(rd.result); }; rd.onerror = function(){ alert('读取文件失败'); }; rd.readAsText(f); }); }
bindFile('moodFile', importMoodsFromText);
bindFile('iconFile', importIconsFromText);
bindFile('badgeFile', importBadgesFromText);
var pasteMode = 'mood';
function openPasteModal(mode){ pasteMode = mode || 'mood'; var pm = document.getElementById('pasteModal'); if (!pm) return; var ti = document.getElementById('pasteTitle'); if (ti) ti.textContent = (pasteMode==='icon'?'📋 粘贴导入图标':(pasteMode==='badge'?'📋 粘贴导入角标':'📋 粘贴导入表情')); var ta = document.getElementById('pasteText'); if (ta) ta.value = ''; pm.style.display = 'flex'; if (ta) ta.focus(); if (navigator.clipboard && navigator.clipboard.readText){ navigator.clipboard.readText().then(function(t){ if (t && ta && !ta.value) ta.value = t; }).catch(function(){}); } }
function closePasteModal(){ var pm = document.getElementById('pasteModal'); if (pm) pm.style.display = 'none'; }
document.getElementById('moodPaste').onclick = function(){ openPasteModal('mood'); };
document.getElementById('iconPaste').onclick = function(){ openPasteModal('icon'); };
document.getElementById('badgePaste').onclick = function(){ openPasteModal('badge'); };
document.getElementById('pasteCancel').onclick = closePasteModal;
document.getElementById('pasteOk').onclick = function(){ var ta = document.getElementById('pasteText'); var txt = ta ? ta.value : ''; closePasteModal(); if (!txt || !txt.trim()) return; if (pasteMode==='icon') importIconsFromText(txt); else if (pasteMode==='badge') importBadgesFromText(txt); else importMoodsFromText(txt); };
renderBadgeSel();
// 预加载 cyber（Codename Coder）字体：ERROR 606 警告页用 cyber 矢量字，首次 fillText 前先下载，避免回退系统默认字体
if (document.fonts && document.fonts.load) document.fonts.load('96px cyber');
requestAnimationFrame(frame);
</script>
